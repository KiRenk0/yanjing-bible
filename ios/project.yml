name: YanJing
options:
  bundleIdPrefix: org.yanjing
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: 1.7.0
    CURRENT_PROJECT_VERSION: 13
    CODE_SIGN_STYLE: Automatic
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.19.2
targets:
  YanJing:
    type: application
    platform: iOS
    sources:
      - path: YanJing
        excludes: [Info.plist, Resources]
      - path: YanJing/Resources
        excludes: [Corpus]
        buildPhase: resources
      - path: YanJing/Resources/Corpus
        type: folder
        buildPhase: resources
    info:
      path: YanJing/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.yanjing.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: onnxruntime
        product: onnxruntime
  YanJingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YanJingTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YanJing
  YanJingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YanJingUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YanJing
schemes:
  YanJing:
    build:
      targets:
        YanJing: all
    test:
      targets: [YanJingTests, YanJingUITests]
      gatherCoverageData: true

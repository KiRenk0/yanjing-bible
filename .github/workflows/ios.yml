name: iOS native build
on:
  push:
    branches: [main, 'codex/**']
    paths: ['ios/**', 'app/src/main/assets/**', 'scripts/prepare-ios.mjs', 'scripts/verify-ios.py', 'scripts/generate-localizations.mjs', 'localization/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ios/DerivedData/SourcePackages
          key: ios-onnx-1.19.2-${{ runner.os }}-${{ runner.arch }}
      - name: Select latest installed stable Xcode
        run: |
          python3 - <<'PY'
          import glob, os, subprocess
          apps = [p for p in glob.glob('/Applications/Xcode*.app') if 'beta' not in p.lower()]
          def version(p):
              return tuple(int(n) for n in subprocess.check_output(['/usr/libexec/PlistBuddy','-c','Print :CFBundleShortVersionString',p+'/Contents/Info.plist'],text=True).strip().split('.'))
          selected = max(apps, key=version)
          subprocess.run(['sudo','xcode-select','-s',selected+'/Contents/Developer'],check=True)
          PY
          xcodebuild -version
      - name: Prepare shared offline resources and native project
        run: |
          npm ci
          node scripts/generate-localizations.mjs
          node scripts/prepare-ios.mjs
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Run native model, data and UI tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(),reverse=True) for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test -project ios/YanJing.xcodeproj -scheme YanJing -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath ios/DerivedData -resultBundlePath ios/build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned IPA for local sideload signing
        run: |
          xcodebuild archive -project ios/YanJing.xcodeproj -scheme YanJing -destination 'generic/platform=iOS' -archivePath ios/build/YanJing.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p ios/build/Payload
          cp -R ios/build/YanJing.xcarchive/Products/Applications/YanJing.app ios/build/Payload/
          ditto -c -k --keepParent ios/build/Payload ios/build/yanjing-1.7.0-ios-unsigned.ipa
          ditto -c -k --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/YanJing.app ios/build/yanjing-1.7.0-ios-simulator.zip
          shasum -a 256 ios/build/*.ipa ios/build/*simulator.zip > ios/build/ios-SHA256SUMS.txt
          xcodebuild -version > ios/build/xcode-version.txt
          git rev-parse HEAD > ios/build/source-commit.txt
          python3 scripts/verify-ios.py
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d ios/build/Tests.xcresult ]; then xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/screenshots; fi
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess
          previews = Path('ios/build/previews')
          previews.mkdir(parents=True, exist_ok=True)
          for source in Path('ios/build/screenshots').rglob('*'):
              if source.suffix.lower() in ('.png', '.jpg', '.jpeg'):
                  subprocess.run(['sips','-s','format','jpeg','-s','formatOptions','65','-Z','900',str(source),'--out',str(previews / (source.stem + '.jpg'))],check=True,stdout=subprocess.DEVNULL)
              elif source.suffix == '.json':
                  shutil.copyfile(source, previews / source.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yanjing-ios-${{ github.sha }}
          path: |
            ios/build/*.ipa
            ios/build/*simulator.zip
            ios/build/*.txt
            ios/build/*.json
            ios/build/Tests.xcresult
            ios/build/screenshots
            ios/YanJing.xcodeproj
          retention-days: 30
      - name: Package generated Xcode project
        if: always()
        run: ditto -c -k --keepParent ios/YanJing.xcodeproj ios/build/yanjing-xcode-project.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yanjing-xcode-project-${{ github.sha }}
          path: ios/build/yanjing-xcode-project.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yanjing-ios-screenshots-${{ github.sha }}
          path: ios/build/previews
      - name: Stage verified iOS files in the draft release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.7.0 >/dev/null 2>&1; then
            gh release create v1.7.0 --draft --target "$GITHUB_SHA" --title '盐筋 v1.7.0 · Native iOS and three languages' --notes 'Verified iOS build staged. Android verification and release publication are pending.'
          fi
          DRAFT=$(gh release view v1.7.0 --json isDraft --jq .isDraft)
          test "$DRAFT" = true
          gh release upload v1.7.0 ios/build/yanjing-1.7.0-ios-unsigned.ipa ios/build/yanjing-1.7.0-ios-simulator.zip ios/build/ios-SHA256SUMS.txt ios/build/ios-verification.json ios/build/ios-test-summary.json ios/build/yanjing-xcode-project.zip --clobber
